# 本地开发配置文件
# 此文件用于本地开发环境，不包含生产环境敏感信息

log:
  level: 0  # debug 级别

http:
  port: 8000

admin_password: "admin123"

pg:
  dsn: "host=localhost user=panda-wiki password=panda-wiki dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai"

mq:
  type: "nats"
  nats:
    server: "nats://localhost:4222"
    user: "panda-wiki"
    password: "panda-wiki"

rag:
  provider: "ct"
  ct_rag:
    base_url: "http://localhost:8080/api/v1"
    api_key: "sk-1234567890"

redis:
  addr: "localhost:6379"
  password: "panda-wiki"

auth:
  type: "jwt"
  jwt:
    secret: "panda-wiki"

s3:
  endpoint: "localhost:9000"
  access_key: "s3panda-wiki"
  secret_key: "panda-wiki"

sentry:
  enabled: false
  dsn: ""

caddy_api: "./data/caddy/run/caddy-admin.sock"
subnet_prefix: "169.254.15"
